<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müşteriler - SatışPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="overlay" id="overlay"></div>
        
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="logo"><i class="fas fa-chart-line"></i> SatışPro</div>
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i> Dashboard</a>
            <a href="satislar.html" class="nav-item"><i class="fas fa-shopping-cart"></i> Satışlar</a>
            <a href="musteriler.html" class="nav-item active"><i class="fas fa-users"></i> Müşteriler</a>
            <a href="urunler.html" class="nav-item"><i class="fas fa-box"></i> Ürünler</a>
            <a href="raporlar.html" class="nav-item"><i class="fas fa-chart-bar"></i> Raporlar</a>
        </nav>

        <!-- Main -->
        <main class="main">
            <div class="header">
                <div class="header-left">
                    <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                    <h1>Müşteri Yönetimi</h1>
                </div>
                <button class="btn btn-primary" onclick="openModal()"><i class="fas fa-plus"></i> Yeni Müşteri</button>
            </div>

            <!-- Filters -->
            <div class="filters">
                <select id="filterCinsiyet" onchange="filterMusteriler()">
                    <option value="">Tüm Cinsiyetler</option>
                    <option value="Erkek">Erkek</option>
                    <option value="Kadın">Kadın</option>
                </select>
                <select id="filterSehir" onchange="filterMusteriler()">
                    <option value="">Tüm Şehirler</option>
                </select>
                <input type="text" id="filterArama" placeholder="İsim veya email ara..." oninput="filterMusteriler()">
                <button class="btn btn-secondary btn-sm" onclick="clearFilters()"><i class="fas fa-times"></i> Temizle</button>
            </div>

            <!-- Table -->
            <div class="table-box">
                <div class="table-header">
                    <h4><i class="fas fa-users"></i> Müşteri Listesi</h4>
                    <span id="musteriSayisi" style="color: var(--text-muted);">Toplam: 0 müşteri</span>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Ad Soyad</th>
                            <th>Email</th>
                            <th>Telefon</th>
                            <th>Cinsiyet</th>
                            <th>Şehir</th>
                            <th>Kayıt Tarihi</th>
                            <th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="musterilerBody">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Yeni Müşteri Modal -->
    <div class="modal-overlay" id="musteriModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle"><i class="fas fa-user-plus"></i> Yeni Müşteri</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="musteriForm">
                    <input type="hidden" id="musteriId">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Ad</label>
                            <input type="text" id="ad" required>
                        </div>
                        <div class="form-group">
                            <label>Soyad</label>
                            <input type="text" id="soyad" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>Telefon</label>
                        <input type="text" id="telefon" placeholder="0532-XXX-XXXX">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Cinsiyet</label>
                            <select id="cinsiyet">
                                <option value="">Seçiniz</option>
                                <option value="Erkek">Erkek</option>
                                <option value="Kadın">Kadın</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Müşteri Tipi</label>
                            <select id="musteritipi" required>
                                <option value="Bireysel" selected>Bireysel</option>
                                <option value="Kurumsal">Kurumsal</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Şehir</label>
                        <input type="text" id="sehir">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">İptal</button>
                <button class="btn btn-primary" onclick="kaydet()"><i class="fas fa-save"></i> Kaydet</button>
            </div>
        </div>
    </div>

    <style>
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-secondary);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .modal-body { padding: 20px; }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 20px;
            border-top: 1px solid var(--border);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9rem;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 480px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>

    <script>
        const API = 'http://localhost:3000/api';
        let tumMusteriler = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadMusteriler();
        });

        async function loadMusteriler() {
            try {
                const response = await fetch(`${API}/musteriler`);
                tumMusteriler = await response.json();
                renderMusteriler(tumMusteriler);
                populateSehirFilter();
            } catch (err) {
                console.error('Müşteriler yüklenemedi:', err);
            }
        }

        function renderMusteriler(data) {
            document.getElementById('musteriSayisi').textContent = `Toplam: ${data.length} müşteri`;
            
            document.getElementById('musterilerBody').innerHTML = data.map(m => `
                <tr>
                    <td>${m.musteriid}</td>
                    <td>${m.ad} ${m.soyad}</td>
                    <td>${m.email}</td>
                    <td>${m.telefon || '-'}</td>
                    <td>${m.cinsiyet || '-'}</td>
                    <td>${m.sehir || '-'}</td>
                    <td>${new Date(m.kayittarihi).toLocaleDateString('tr-TR')}</td>
                    <td>
                        <button class="btn btn-icon btn-sm" onclick="duzenle(${m.musteriid})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-icon btn-sm danger" onclick="sil(${m.musteriid})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function populateSehirFilter() {
            const sehirler = [...new Set(tumMusteriler.map(m => m.sehir).filter(Boolean))];
            const select = document.getElementById('filterSehir');
            select.innerHTML = '<option value="">Tüm Şehirler</option>' +
                sehirler.map(s => `<option value="${s}">${s}</option>`).join('');
        }

        function filterMusteriler() {
            const cinsiyet = document.getElementById('filterCinsiyet').value;
            const sehir = document.getElementById('filterSehir').value;
            const arama = document.getElementById('filterArama').value.toLowerCase();

            let filtered = tumMusteriler;

            if (cinsiyet) {
                filtered = filtered.filter(m => m.cinsiyet === cinsiyet);
            }
            if (sehir) {
                filtered = filtered.filter(m => m.sehir === sehir);
            }
            if (arama) {
                filtered = filtered.filter(m => 
                    (m.ad + ' ' + m.soyad).toLowerCase().includes(arama) ||
                    m.email.toLowerCase().includes(arama)
                );
            }

            renderMusteriler(filtered);
        }

        function clearFilters() {
            document.getElementById('filterCinsiyet').value = '';
            document.getElementById('filterSehir').value = '';
            document.getElementById('filterArama').value = '';
            renderMusteriler(tumMusteriler);
        }

        function openModal() {
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-user-plus"></i> Yeni Müşteri';
            document.getElementById('musteriForm').reset();
            document.getElementById('musteriId').value = '';
            document.getElementById('musteriModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('musteriModal').classList.remove('active');
        }

        async function duzenle(id) {
            const musteri = tumMusteriler.find(m => m.musteriid === id);
            if (!musteri) return;

            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit"></i> Müşteri Düzenle';
            document.getElementById('musteriId').value = musteri.musteriid;
            document.getElementById('ad').value = musteri.ad;
            document.getElementById('soyad').value = musteri.soyad;
            document.getElementById('email').value = musteri.email;
            document.getElementById('telefon').value = musteri.telefon || '';
            document.getElementById('cinsiyet').value = musteri.cinsiyet || '';
            document.getElementById('musteritipi').value = musteri.musteritipi || 'Bireysel';
            document.getElementById('sehir').value = musteri.sehir || '';
            document.getElementById('musteriModal').classList.add('active');
        }

        async function kaydet() {
            const id = document.getElementById('musteriId').value;
            const data = {
                ad: document.getElementById('ad').value,
                soyad: document.getElementById('soyad').value,
                email: document.getElementById('email').value,
                telefon: document.getElementById('telefon').value,
                cinsiyet: document.getElementById('cinsiyet').value,
                musteritipi: document.getElementById('musteritipi').value,
                sehir: document.getElementById('sehir').value
            };

            if (!data.ad || !data.soyad || !data.email) {
                alert('Ad, soyad ve email zorunludur!');
                return;
            }

            try {
                const url = id ? `${API}/musteriler/${id}` : `${API}/musteriler`;
                const method = id ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    closeModal();
                    loadMusteriler();
                } else {
                    const err = await response.json();
                    alert(err.error || 'Hata oluştu!');
                }
            } catch (err) {
                alert('Bağlantı hatası!');
            }
        }

        async function sil(id) {
            if (!confirm('Bu müşteriyi silmek istediğinize emin misiniz?')) return;

            try {
                await fetch(`${API}/musteriler/${id}`, { method: 'DELETE' });
                loadMusteriler();
            } catch (err) {
                alert('Silme hatası!');
            }
        }

        // Mobile menu
        document.getElementById('menuToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        });
        document.getElementById('overlay').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
        });
    </script>
</body>
</html>
